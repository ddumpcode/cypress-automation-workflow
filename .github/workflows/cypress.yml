name: cypress test

on:
  push:
    branches:
      - master

  pull_request:
    branches:
      - master

  workflow_dispatch:

  schedule:
    - cron: "0 1 * * *"

jobs:
  cypress:
    runs-on: ubuntu-latest

    steps:
      - name: checkout code
        uses: actions/checkout@v4

      - name: setup node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: install dependencies
        run: npm ci

      - name: clean old test reports
        run: rm -f cypress/result/*.json

      - name: run cypress tests
        run: npx cypress run --spec "cypress/e2e/demoblaze/**/*.cy.js"

      - name: send discord notification
        if: always()
        env:
          DISCORD_WEBHOOK: ${{ secrets.CYPRESS_REPORT_DISCORD_WEBHOOK }}
          STATUS: ${{ job.status }}
          REPOSITORY: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
          EVENT: ${{ github.event_name }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          # read mochawesome json reports
          shopt -s nullglob
          REPORTS=(cypress/result/*.json)

          if [ ${#REPORTS[@]} -gt 0 ]; then
            STATS=$(jq -s '{
              total: (map(.stats.tests // 0) | add // 0),
              passed: (map(.stats.passes // 0) | add // 0),
              failed: (map(.stats.failures // 0) | add // 0),
              pending: (map(.stats.pending // 0) | add // 0)
            }' "${REPORTS[@]}")
          else
            STATS='{"total":0,"passed":0,"failed":0,"pending":0}'
          fi

          TOTAL=$(echo "$STATS" | jq -r '.total')
          PASSED=$(echo "$STATS" | jq -r '.passed')
          FAILED=$(echo "$STATS" | jq -r '.failed')
          PENDING=$(echo "$STATS" | jq -r '.pending')

          # Get test results per spec
          SPEC_RESULTS=""

          for report in "${REPORTS[@]}"; do
            SPEC_LINES=$(jq -r '
              .results[] as $result |
              ([$result | .. | objects | .tests[]?]) as $tests |
              "\(($result.file // $result.fullFile // "unknown") | split("\\")[-1])  ✅ \([$tests[] | select(.state == "passed")] | length) | ❌ \([$tests[] | select(.state == "failed")] | length)"
            ' "$report")

            if [ -n "$SPEC_LINES" ]; then
              SPEC_RESULTS+="${SPEC_LINES}"$'\n'
            fi
          done

          if [ -z "$SPEC_RESULTS" ]; then
            SPEC_RESULTS="No spec report available"
          fi

          # Set embed status and color
          if [ "$STATUS" = "success" ]; then
            TITLE="✅ Cypress Test Execution - PASSED"
            COLOR=3066993
          else
            TITLE="❌ Cypress Test Execution - FAILED"
            COLOR=15158332
          fi

          # Create Discord Embed
          PAYLOAD=$(jq -n \
            --arg title "$TITLE" \
            --arg repo "$REPOSITORY" \
            --arg branch "$BRANCH" \
            --arg event "$EVENT" \
            --arg url "$RUN_URL" \
            --arg spec_results "$SPEC_RESULTS" \
            --argjson color "$COLOR" \
            --argjson total "$TOTAL" \
            --argjson passed "$PASSED" \
            --argjson failed "$FAILED" \
            --argjson pending "$PENDING" \
            '{
              embeds: [{
                title: $title,
                url: $url,
                color: $color,
                fields: [
                  {
                    name: "Repository",
                    value: $repo,
                    inline: false
                  },
                  {
                    name: "Branch",
                    value: $branch,
                    inline: true
                  },
                  {
                    name: "Trigger",
                    value: $event,
                    inline: true
                  },
                  {
                    name: "Total Tests",
                    value: ($total | tostring),
                    inline: true
                  },
                  {
                    name: "✅ Passed",
                    value: ($passed | tostring),
                    inline: true
                  },
                  {
                    name: "❌ Failed",
                    value: ($failed | tostring),
                    inline: true
                  },
                  {
                    name: "⏳ Pending",
                    value: ($pending | tostring),
                    inline: true
                  },
                  {
                    name: "📋 Test Results per Spec",
                    value: ("```" + $spec_results + "```"),
                    inline: false
                  }
                  
                ],
                footer: {
                  text: "Cypress Automation | DemoBlaze"
                }
              }]
            }')

          curl -fsS \
            -H "Content-Type: application/json" \
            -X POST \
            -d "$PAYLOAD" \
            "$DISCORD_WEBHOOK"
