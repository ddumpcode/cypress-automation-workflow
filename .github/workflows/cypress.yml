name: cypress test

on:
  push:
    branches:
      - master

  pull-request:
    branches:
      - master

  workflow_dispatch:

  schedule:
    - cron: "0 1 * * *"

jobs:
  cypress:
    runs-on: ubuntu-latest
    steps:
      - name: checkout code
        uses: actions/checkout@v4

      - name: setup node.js
        uses: action/setup-node@4
        with:
          node-version: 20
          cache: npm

      - name: install depedencies
        run: npm ci

      - name: run cypress tests
        run: npx cypress run
