name: cypress test

on:
  push:
    branches:
      - master

  pull_request:
    branches:
      - master

  workflow_dispatch:

  schedule:
    # 05.17 WIB, Monday-Friday
    - cron: "17 22 * * 0-4"

    # 13.17 WIB, Monday-Friday
    - cron: "17 6 * * 1-5"

permissions:
  contents: read

jobs:
  # ==========================================
  # JOB 1: RUN CYPRESS TESTS
  # ==========================================
  cypress-tests:
    name: 1. Run Cypress Tests
    runs-on: ubuntu-latest

    steps:
      - name: checkout code
        uses: actions/checkout@v4

      - name: setup node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: install dependencies
        run: npm ci

      - name: clean old test reports
        run: rm -f cypress/result/*.json

      - name: run cypress tests
        run: npx cypress run --spec "cypress/e2e/demoblaze/**/*.cy.js"

      - name: upload mochawesome json reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-json-reports
          path: cypress/result/*.json
          if-no-files-found: warn
          retention-days: 7

  # ==========================================
  # JOB 2: GENERATE & DEPLOY REPORT
  # ==========================================
  generate-report:
    name: 2. Generate & Deploy Report
    runs-on: ubuntu-latest

    needs: cypress-tests
    if: always() && needs.cypress-tests.result != 'cancelled'

    permissions:
      contents: read
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: checkout code
        uses: actions/checkout@v4

      - name: setup node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: install dependencies
        run: npm ci

      - name: download mochawesome json reports
        uses: actions/download-artifact@v4
        with:
          name: cypress-json-reports
          path: cypress/result
          if-no-artifact-found: warn

      - name: merge json reports and generate html
        run: |
          mkdir -p cypress/report

          if compgen -G "cypress/result/*.json" > /dev/null; then
            npx mochawesome-merge "cypress/result/*.json" \
              -o merged-report.json

            npx marge merged-report.json \
              --reportDir cypress/report \
              --reportFilename index \
              --inline
          else
            echo "No Cypress JSON reports available."
            cat > cypress/report/index.html <<'EOF'
          <!DOCTYPE html>
          <html>
          <head>
            <title>Cypress Test Report</title>
          </head>
          <body>
            <h1>Cypress Test Report</h1>
            <p>No test report was generated.</p>
          </body>
          </html>
          EOF
          fi

      - name: configure github pages
        uses: actions/configure-pages@v5

      - name: upload github pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: cypress/report

      - name: deploy to github pages
        id: deployment
        uses: actions/deploy-pages@v4

  # ==========================================
  # JOB 3: NOTIFY DISCORD
  # ==========================================
  notify-discord:
    name: 3. Notify Discord
    runs-on: ubuntu-latest

    needs:
      - cypress-tests
      - generate-report

    if: always() && needs.cypress-tests.result != 'cancelled'

    env:
      DISCORD_WEBHOOK: ${{ secrets.CYPRESS_REPORT_DISCORD_WEBHOOK }}
      TEST_STATUS: ${{ needs.cypress-tests.result }}
      REPORT_STATUS: ${{ needs.generate-report.result }}
      REPORT_URL: ${{ needs.generate-report.outputs.page_url }}
      REPOSITORY: ${{ github.repository }}
      BRANCH: ${{ github.head_ref || github.ref_name }}
      EVENT: ${{ github.event_name }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      RUN_NUMBER: ${{ github.run_number }}
      RUN_ATTEMPT: ${{ github.run_attempt }}

    steps:
      - name: download mochawesome json reports
        uses: actions/download-artifact@v4
        with:
          name: cypress-json-reports
          path: cypress/result
          if-no-artifact-found: warn

      - name: prepare and send discord notification
        run: |
          shopt -s nullglob
          REPORTS=(cypress/result/*.json)

          if [ ${#REPORTS[@]} -gt 0 ]; then
            STATS=$(jq -s '{
              total: (map(.stats.tests // 0) | add // 0),
              passed: (map(.stats.passes // 0) | add // 0),
              failed: (map(.stats.failures // 0) | add // 0),
              pending: (map(.stats.pending // 0) | add // 0)
            }' "${REPORTS[@]}")
          else
            STATS='{"total":0,"passed":0,"failed":0,"pending":0}'
          fi

          TOTAL=$(echo "$STATS" | jq -r '.total')
          PASSED=$(echo "$STATS" | jq -r '.passed')
          FAILED=$(echo "$STATS" | jq -r '.failed')
          PENDING=$(echo "$STATS" | jq -r '.pending')

          # Get execution time and duration
          if [ ${#REPORTS[@]} -gt 0 ]; then
            START_TIME=$(jq -s -r '
              [.[].stats.start // empty] | min // empty
            ' "${REPORTS[@]}")

            END_TIME=$(jq -s -r '
              [.[].stats.end // empty] | max // empty
            ' "${REPORTS[@]}")
          else
            START_TIME=""
            END_TIME=""
          fi

          if [ -n "$START_TIME" ] && [ -n "$END_TIME" ]; then
            EXECUTION_TIME=$(TZ=Asia/Jakarta date -d "$START_TIME" '+%d %b %Y, %H:%M:%S WIB')

            START_SECONDS=$(date -d "$START_TIME" +%s)
            END_SECONDS=$(date -d "$END_TIME" +%s)

            DURATION_SECONDS=$((END_SECONDS - START_SECONDS))

            MINUTES=$((DURATION_SECONDS / 60))
            REMAINING_SECONDS=$((DURATION_SECONDS % 60))

            DURATION_TEXT="${MINUTES}m ${REMAINING_SECONDS}s"
          else
            EXECUTION_TIME="Unavailable"
            DURATION_TEXT="Unavailable"
          fi

          # Get test results per spec
          SPEC_RESULTS=""

          for report in "${REPORTS[@]}"; do
            SPEC_LINES=$(jq -r '
              .results[] as $result |
              ([ $result | .. | objects | .tests[]? ]) as $tests |
              "\(($result.file // $result.fullFile // "unknown") | gsub("\\\\"; "/") | split("/")[-1])  ✅ \([$tests[] | select(.state == "passed")] | length) | ❌ \([$tests[] | select(.state == "failed")] | length)"
            ' "$report")

            if [ -n "$SPEC_LINES" ]; then
              SPEC_RESULTS+="${SPEC_LINES}"$'\n'
            fi
          done

          if [ -z "$SPEC_RESULTS" ]; then
            SPEC_RESULTS="No spec report available"
          fi

          # Get failed test cases
          FAILED_TESTS=""

          for report in "${REPORTS[@]}"; do
            FAILED_LINES=$(jq -r '
              .results[] |
              .. | objects | .tests[]? |
              select(.state == "failed") |
              "- ❌ \(.title | if length > 80 then (.[0:77] + "...") else . end)"
            ' "$report")

            if [ -n "$FAILED_LINES" ]; then
              FAILED_TESTS+="${FAILED_LINES}"$'\n'
            fi
          done

          if [ -z "$FAILED_TESTS" ]; then
            FAILED_TESTS="No failed test cases"
          elif [ ${#FAILED_TESTS} -gt 1000 ]; then
            # Batas aman Discord webhook description/fields
            FAILED_TESTS="${FAILED_TESTS:0:950}... (Terpotong, cek HTML Report untuk detail penuh)"
          fi

          # Set test status and color
          if [ "$TEST_STATUS" = "success" ]; then
            TITLE="✅ Cypress Tests PASSED"
            COLOR=3066993
          else
            TITLE="❌ Cypress Tests FAILED"
            COLOR=15158332
          fi

          if [ "$REPORT_STATUS" = "success" ] && [ -n "$REPORT_URL" ]; then
            REPORT_TEXT="[Open HTML Report]($REPORT_URL)"
          else
            REPORT_TEXT="HTML report deployment unavailable"
          fi

          # Create Discord Embed
          RUN_TEXT="[Run #${RUN_NUMBER} - Attempt ${RUN_ATTEMPT}]($RUN_URL)"
          PAYLOAD=$(jq -n \
            --arg title "$TITLE" \
            --arg repo "$REPOSITORY" \
            --arg branch "$BRANCH" \
            --arg event "$EVENT" \
            --arg run_url "$RUN_URL" \
            --arg report_text "$REPORT_TEXT" \
            --arg spec_results "$SPEC_RESULTS" \
            --arg test_status "$TEST_STATUS" \
            --arg report_status "$REPORT_STATUS" \
            --argjson color "$COLOR" \
            --argjson total "$TOTAL" \
            --argjson passed "$PASSED" \
            --argjson failed "$FAILED" \
            --argjson pending "$PENDING" \
            --arg run_text "$RUN_TEXT" \
            --arg execution_time "$EXECUTION_TIME" \
            --arg duration_text "$DURATION_TEXT" \
            --arg failed_tests "$FAILED_TESTS" \
            '{
              embeds: [{
                title: $title,
                url: $run_url,
                color: $color,
                description: (
                  "**DEMOBLAZE AUTOMATION REPORT**\n" +
                  "**Repository:** " + $repo + "\n" +
                  "**Branch:** `" + $branch + "`\n" +
                  "**Execution:** " + $run_text
                ),
                fields: [
                  {name:"Trigger",value:$event,inline:true},
                  {name:"Total Tests",value:("\n" + ($total|tostring)),inline:true},
                  {name:"✅ Passed",value:($passed|tostring),inline:true},
                  {name:"❌ Failed",value:($failed|tostring),inline:true},
                  {name:"⏳ Pending",value:($pending|tostring),inline:true},
                  {
                    name:"📋 Test Results per Spec",
                    value:("```text\n" + $spec_results + "```"),
                    inline:false
                  },
                  {name:"\u200b",value:"\u200b",inline:false},
                  {
                    name:"🕒 Execution Time",
                    value:$execution_time,
                    inline:true
                  },
                  {
                    name:"⏱️ Duration",
                    value:$duration_text,
                    inline:true
                  },
                  {
                    name:"❌ Failed Test Cases",
                    value:("```text\n" + $failed_tests + "```"),
                    inline:false
                  },
                  {
                    name:"🌐 HTML Test Report",
                    value:$report_text,
                    inline:false
                  },
                  {
                    name:"Report Deployment Status",
                    value:$report_status,
                    inline:true
                  }
                ],
                footer:{
                  text:"Cypress Automation | DemoBlaze"
                },
                timestamp:(now | todateiso8601)
              }]
            }')

          curl -fsS \
            -H "Content-Type: application/json" \
            -X POST \
            -d "$PAYLOAD" \
            "$DISCORD_WEBHOOK"
