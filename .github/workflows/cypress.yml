name: cypress test

on:
  push:
    branches:
      - master

  pull_request:
    branches:
      - master

  workflow_dispatch:

  schedule:
    - cron: "0 1 * * *"

jobs:
  cypress:
    runs-on: ubuntu-latest

    steps:
      - name: checkout code
        uses: actions/checkout@v4

      - name: setup node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: install dependencies
        run: npm ci

      - name: run cypress tests
        run: npx cypress run --spec "cypress/e2e/demoblaze/**/*.cy.js"

      - name: send discord notification
        if: always()
        env:
          DISCORD_WEBHOOK: ${{ secrets.CYPRESS_REPORT_DISCORD_WEBHOOK }}
          STATUS: ${{ job.status }}
          REPOSITORY: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ "$STATUS" = "success" ]; then
            MESSAGE="✅ Cypress Tests PASSED"
          else
            MESSAGE="❌ Cypress Tests FAILED"
          fi

          PAYLOAD=$(jq -n \
            --arg content "$MESSAGE

          Repository: $REPOSITORY
          Branch: $BRANCH
          Workflow: $RUN_URL" \
            '{content: $content}')

          curl -H "Content-Type: application/json" \
            -X POST \
            -d "$PAYLOAD" \
            "$DISCORD_WEBHOOK"
